[workspace]
members = [
    "crates/eden_logger",
    "crates/eden_logger_export",
    "crates/eden_logger_macros",
]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
criterion = { version = "0.5.1", features = [
    "async",
    "async_tokio",
    "html_reports",
    "tokio",
] }
env_logger = "0.10.2"
fast-telemetry = { version = "0.9.0", default-features = false }
fast-telemetry-export = { version = "0.9.0", default-features = false }
function_name = "0.3.0"
hegeltest = "=0.28.2"
itoa = "1.0.15"
log = "0.4.28"
opentelemetry = "0.30.0"
parking_lot = "0.12"
prost = "0.13"
proc-macro2 = "1.0.103"
quote = "1.0.42"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smol_str = { version = "0.3.4", features = ["serde"] }
syn = { version = "2.0.111", features = ["extra-traits", "full", "parsing"] }
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
ufmt = "0.2"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(embedded_db)"]

[workspace.lints.clippy]
unwrap_used = "deny"
